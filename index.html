<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1424" />
<meta name="format-detection" content="telephone=no" />
<title>REAL FISHING WORLD — 波戸浦港（Phase 2 ウキ釣り）</title>
<style>
:root{
  --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px);
  --gap:12px; --tb:48px; --main:72px; --mainF:88px; --joy:128px; --reel:96px;
  --btn:rgba(12,22,38,.58); --accent:#FF8A3D; --danger:#E5484D; --ink:#fff;
}
@media (orientation:landscape){ :root{ --main:64px; --mainF:76px; --joy:112px; --reel:88px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1424;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#touch{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
body.playing #hud{opacity:1}
#hud [data-ui]{pointer-events:auto}
button{font:inherit;color:inherit;border:0;margin:0;padding:0;cursor:pointer;touch-action:manipulation}
.btn{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--btn);
  border:1.5px solid rgba(255,255,255,.35);border-radius:14px;font-weight:700;line-height:1.1;text-shadow:0 1px 2px #000,0 0 3px #0b1424;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.btn:active{background:rgba(40,60,90,.85)}
.btn::before{content:"";position:absolute;inset:-6px}
.btn .ic{font-size:19px;line-height:1}
.btn .lb{font-size:10px;letter-spacing:0}
.btn[disabled],.btn.off{opacity:.55}
.tb{width:var(--tb);height:var(--tb);top:calc(var(--sa-t) + 8px)}
#btnMenu{left:calc(var(--sa-l) + 16px)}
#btnMap{right:calc(var(--sa-r) + 16px + var(--tb) + var(--gap))}
#btnCam{right:calc(var(--sa-r) + 16px)}
#btnGear{right:calc(var(--sa-r) + 16px)}
#btnExit{left:calc(var(--sa-l) + 16px);background:rgba(229,72,77,.82)}
.chip{position:absolute;top:calc(var(--sa-t) + 8px);left:calc(var(--sa-l) + 76px);right:calc(var(--sa-r) + 136px);height:var(--tb);
  padding:4px 10px;border-radius:12px;background:var(--btn);border:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;
  font-size:12px;line-height:1.25;font-weight:700;text-shadow:0 1px 2px #000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
.chip div{overflow:hidden;text-overflow:ellipsis}
.chip small{font-weight:600;opacity:.9;font-size:11px}
@media (max-width:340px){
  .chip{padding:3px 4px;font-size:10px;line-height:1.15}
  .chip small{font-size:9.5px}
  .chip div,.chip small{white-space:normal;overflow-wrap:anywhere;overflow:hidden;max-height:2.4em}
}
#chipF{right:calc(var(--sa-r) + 76px)}
.main{right:calc(var(--sa-r) + 20px);bottom:calc(var(--sa-b) + 32px);width:var(--main);height:var(--main);border-radius:50%;background:var(--accent);border-color:#fff;font-size:12px}
.main .ic{font-size:22px}
.main .lb{font-size:12px}
.main.off{background:rgba(90,96,108,.75);opacity:.8}
#btnBag{right:calc(var(--sa-r) + 20px + var(--main) + var(--gap));bottom:calc(var(--sa-b) + 32px + (var(--main) - 48px)/2);width:48px;height:48px}
#btnRun{left:calc(var(--sa-l) + 24px + (var(--joy) - 56px)/2);bottom:calc(var(--sa-b) + 24px + var(--joy) + var(--gap));width:56px;height:56px;border-radius:50%}
#btnRun.on{background:var(--accent);border-color:#fff;box-shadow:0 0 0 3px rgba(255,138,61,.45)}
#btnRun.on .lb{color:#fff}
#joyRing{position:absolute;left:calc(var(--sa-l) + 24px);bottom:calc(var(--sa-b) + 24px);width:var(--joy);height:var(--joy);border-radius:50%;
  border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);pointer-events:none;opacity:.8}
#joyRing.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.75)}
#joyKnob{position:absolute;left:50%;top:50%;width:calc(var(--joy)*.45);height:calc(var(--joy)*.45);margin:calc(var(--joy)*-.225);border-radius:50%;
  background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9)}
/* 釣りUI */
#btnReel{left:calc(var(--sa-l) + 24px);bottom:calc(var(--sa-b) + 32px);width:var(--reel);height:var(--reel);border-radius:50%}
#btnAction{right:calc(var(--sa-r) + 20px);bottom:calc(var(--sa-b) + 32px);width:var(--mainF);height:var(--mainF);border-radius:50%;background:rgba(90,96,108,.8)}
#btnRetrieve,#btnAim{right:calc(var(--sa-r) + 20px + (var(--mainF) - 60px)/2);bottom:calc(var(--sa-b) + 32px + var(--mainF) + var(--gap));width:60px;height:60px;border-radius:16px}
#btnAuto{right:calc(var(--sa-r) + 20px + (var(--mainF) - 56px)/2);bottom:calc(var(--sa-b) + 32px + var(--mainF) + var(--gap) + 60px + 10px);width:56px;height:56px}
#infoCard{position:absolute;top:calc(var(--sa-t) + 64px);left:50%;transform:translateX(-50%);width:min(320px,calc(100vw - var(--sa-l) - var(--sa-r) - 32px));
  padding:8px 12px;border-radius:12px;background:var(--btn);border:1px solid rgba(255,255,255,.25);font-size:13px;line-height:1.45;font-weight:600;text-shadow:0 1px 2px #000}
#infoCard b{color:#ffd37a}
#infoCard .warn{color:#ffb4a0}
.mv,.fs{transition:opacity .15s}
body[data-mode="move"] .fs,body[data-mode="fish"] .mv{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 32px + var(--main) + 84px);max-width:calc(100vw - 32px);padding:9px 14px;border-radius:12px;background:rgba(10,18,32,.86);
  border:1px solid rgba(255,255,255,.3);font-size:14px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-shadow:0 1px 2px #000}
#toast.show{opacity:1}
/* 移動モード：トーストは「走る」ボタン（左下）の上に出して重ならないようにする */
body[data-mode="move"] #toast{bottom:calc(var(--sa-b) + 24px + var(--joy) + var(--gap)*2 + 56px)}
#hintLine{position:absolute;left:0;right:0;bottom:calc(var(--sa-b) + 4px);text-align:center;font-size:10px;opacity:.7;pointer-events:none;text-shadow:0 1px 2px #000}

/* ---- Phase 2 釣りUI ---- */
.ph{display:none}
.ph.show{display:flex}
#btnReel{touch-action:none;background:rgba(12,22,38,.7)}
#btnReel.hold{background:var(--accent);border-color:#fff}
#btnAction.go{background:var(--accent);border-color:#fff}
#btnAction.alert{background:var(--danger);border-color:#fff;animation:pulse .35s infinite alternate}
#btnAction.hold{background:var(--accent);box-shadow:0 0 0 4px rgba(255,138,61,.5)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
.sm{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:800}
#dragPlus{left:calc(var(--sa-l) + 132px);bottom:calc(var(--sa-b) + 32px + 44px + 4px + 32px + 4px)}
#dragVal{left:calc(var(--sa-l) + 132px);bottom:calc(var(--sa-b) + 32px + 44px + 4px);width:44px;height:32px;position:absolute;flex-direction:column;align-items:center;justify-content:center;
  border-radius:8px;background:var(--btn);border:1px solid rgba(255,255,255,.3);font-size:9px;line-height:1.05;font-weight:700;text-shadow:0 1px 2px #000}
#dragVal b{font-size:13px}
#dragVal.ok b{color:#7CE0A0}#dragVal.hi b{color:#ff9a7a}#dragVal.lo b{color:#ffd37a}
#dragMinus{left:calc(var(--sa-l) + 132px);bottom:calc(var(--sa-b) + 32px)}
.gauge{position:absolute;top:calc(var(--sa-t) + 64px);left:50%;transform:translateX(-50%);width:min(342px,calc(100vw - var(--sa-l) - var(--sa-r) - 32px));height:22px;
  border-radius:11px;background:rgba(8,16,30,.7);border:1.5px solid rgba(255,255,255,.55);overflow:hidden;align-items:center;justify-content:center;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
.gauge i{position:absolute;left:0;top:0;bottom:0;width:0;background:#3fcf7a;transition:background .15s}
.gauge span{position:relative}
#tenGauge.warn i{background:#f0c040}#tenGauge.danger i{background:#E5484D}#tenGauge.blink{animation:blink .22s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.45}}
#powerGauge i{background:#FF8A3D}
#fightInfo{position:absolute;top:calc(var(--sa-t) + 64px + 26px);left:50%;transform:translateX(-50%);width:min(342px,calc(100vw - var(--sa-l) - var(--sa-r) - 32px));height:40px;
  padding:3px 8px;border-radius:10px;background:var(--btn);border:1px solid rgba(255,255,255,.25);flex-direction:column;justify-content:center;align-items:center;font-size:12px;line-height:1.3;font-weight:700;text-shadow:0 1px 2px #000;text-align:center;overflow:hidden}
#rodInd{position:absolute;right:calc(var(--sa-r) + 20px + (var(--mainF) - 44px)/2);bottom:calc(var(--sa-b) + 32px + var(--mainF) + 12px);width:44px;height:104px;border-radius:10px;background:var(--btn);border:1px solid rgba(255,255,255,.3);
  flex-direction:column;align-items:center;justify-content:flex-start;font-size:10px;font-weight:700;padding-top:3px;text-shadow:0 1px 2px #000}
#rodInd .bar{position:relative;flex:1;width:6px;margin:3px 0 4px;border-radius:3px;background:rgba(255,255,255,.3)}
#rodInd .bar i{position:absolute;left:-5px;width:16px;height:5px;border-radius:2px;background:#FF8A3D;bottom:50%}
#rodInd .bar u{position:absolute;left:-2px;width:10px;bottom:34%;height:22%;background:rgba(124,224,160,.55);border-radius:2px;text-decoration:none}
#btnRetrieve{background:rgba(24,70,110,.82);border-color:#bfe3ff}
#btnRetrieve .ic,#btnAim .ic{font-size:24px;font-weight:900}
#btnRetrieve .lb,#btnAim .lb{font-size:12px}
#btnAim{background:rgba(12,22,38,.7)}
#btnAuto .lb{font-size:10px}
#btnAuto.on{background:var(--accent);border-color:#fff;box-shadow:0 0 0 3px rgba(255,138,61,.45)}
body[data-auto="1"] #btnAction{background:rgba(90,96,108,.75)}
.tutHi{animation:tutHi .8s infinite alternate;box-shadow:0 0 0 4px rgba(255,255,255,.85)!important}
@keyframes tutHi{from{outline:0 solid rgba(255,255,255,.0)}to{outline:6px solid rgba(255,255,255,.35)}}
#btnAction .ic{font-size:26px}
#btnAction .lb{font-size:14px}
/* アタリ・合わせの合図（操作を邪魔しない） */
#cue{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(1);z-index:20;pointer-events:none;opacity:0;font-weight:900;font-size:34px;letter-spacing:.04em;text-shadow:0 2px 6px #000,0 0 14px rgba(0,0,0,.6);white-space:nowrap;padding:4px 18px;border-radius:14px;background:rgba(10,18,32,.55)}
#cue.show{animation:cueIn .9s ease-out forwards}
#cue.bite{color:#ffd37a}#cue.hit{color:#9be8b4}#cue.miss{color:#cfd6df}#cue.pre{font-size:18px;color:#fff}
@keyframes cueIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
#flash{position:fixed;inset:0;z-index:19;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,138,61,0);opacity:0}
#flash.show{animation:flashIn .7s ease-out}
@keyframes flashIn{0%{opacity:1;box-shadow:inset 0 0 70px 14px rgba(255,138,61,.75)}100%{opacity:0;box-shadow:inset 0 0 70px 14px rgba(255,138,61,0)}}
/* チュートリアル（短く・いつでもスキップ） */
#tutBar{position:absolute;top:calc(var(--sa-t) + 64px);left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - var(--sa-l) - var(--sa-r) - 32px));min-height:44px;display:none;align-items:center;gap:8px;padding:2px 4px 2px 10px;
  border-radius:12px;background:rgba(255,255,255,.94);color:#12202f;border:2px solid var(--accent);font-size:13px;font-weight:800;line-height:1.3;text-shadow:none;z-index:25}
#tutBar.show{display:flex}
#tutBar .n{flex:none;min-width:30px;font-size:11px;color:#c25a12}
#tutBar .t{flex:1;min-width:0}
#tutSkip{flex:none;min-width:56px;min-height:44px;border-radius:10px;background:#e8edf3;color:#334;font-weight:800;font-size:12px;padding:0 8px;position:relative}
#tutSkip::before{content:"";position:absolute;inset:-2px}
body[data-phase="aim"] #tutBar,body[data-phase="fight"] #tutBar{top:calc(var(--sa-t) + 64px + 26px)}
body[data-tut="1"][data-phase="fight"] #fightInfo{display:none!important}
body[data-tut="1"]:not([data-phase="fight"]) #infoCard{display:none!important}
/* 釣り中のトースト位置：縦持ちは右ボタン列の上、横持ちは下中央 */
body[data-mode="fish"] #toast{bottom:calc(var(--sa-b) + var(--mainF) + 184px)}
@media (orientation:landscape){ body[data-mode="fish"] #toast{bottom:calc(var(--sa-b) + 10px);max-width:max(180px,calc(100vw - 400px))} }
/* 片手レイアウト：右手（右の親指に集約）／左手（左の親指に集約） */
body[data-hand="right"] #btnReel{left:auto;right:calc(var(--sa-r) + 20px + var(--mainF) + var(--gap))}
body[data-hand="right"] #dragMinus{left:auto;right:calc(var(--sa-r) + 20px + var(--mainF) + var(--gap));bottom:calc(var(--sa-b) + 32px + var(--reel) + 10px)}
body[data-hand="right"] #dragVal{left:auto;right:calc(var(--sa-r) + 20px + var(--mainF) + var(--gap) + 48px);bottom:calc(var(--sa-b) + 32px + var(--reel) + 10px)}
body[data-hand="right"] #dragPlus{left:auto;right:calc(var(--sa-r) + 20px + var(--mainF) + var(--gap) + 96px);bottom:calc(var(--sa-b) + 32px + var(--reel) + 10px)}
body[data-hand="left"] #btnAction{right:auto;left:calc(var(--sa-l) + 20px)}
body[data-hand="left"] #btnRetrieve,body[data-hand="left"] #btnAim{right:auto;left:calc(var(--sa-l) + 20px + (var(--mainF) - 60px)/2)}
body[data-hand="left"] #btnAuto{right:auto;left:calc(var(--sa-l) + 20px + (var(--mainF) - 56px)/2)}
body[data-hand="left"] #rodInd{right:auto;left:calc(var(--sa-l) + 20px + (var(--mainF) - 44px)/2)}
body[data-hand="left"] #btnReel{left:calc(var(--sa-l) + 20px + var(--mainF) + var(--gap))}
body[data-hand="left"] #dragMinus{left:calc(var(--sa-l) + 20px + var(--mainF) + var(--gap));bottom:calc(var(--sa-b) + 32px + var(--reel) + 10px)}
body[data-hand="left"] #dragVal{left:calc(var(--sa-l) + 20px + var(--mainF) + var(--gap) + 48px);bottom:calc(var(--sa-b) + 32px + var(--reel) + 10px)}
body[data-hand="left"] #dragPlus{left:calc(var(--sa-l) + 20px + var(--mainF) + var(--gap) + 96px);bottom:calc(var(--sa-b) + 32px + var(--reel) + 10px)}
/* 結果カード：控えめに */
#resultCard{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 14px);width:min(380px,calc(100vw - var(--sa-l) - var(--sa-r) - 24px));display:none;
  padding:12px 14px;border-radius:16px;background:rgba(8,16,30,.9);border:1.5px solid rgba(255,255,255,.5);text-align:center;text-shadow:0 1px 2px #000;max-height:calc(100vh - var(--sa-t) - var(--sa-b) - 80px);overflow:auto;touch-action:pan-y}
#resultCard.open{display:block}
#resultCard h2{margin:0 0 4px;font-size:20px}
#resultCard .big{font-size:22px;font-weight:800;color:#fff;margin:2px 0}
#resultCard p{margin:3px 0;font-size:13px;line-height:1.45}
#resultCard .badge{display:inline-block;padding:2px 10px;border-radius:10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle}
#resultCard .btns{display:flex;gap:10px;justify-content:center;margin-top:8px}
#resultCard .btns button{flex:1;min-height:48px;border-radius:12px;font-weight:800;font-size:16px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5)}
#resultCard .btns button.pri{background:var(--accent);border-color:#fff}
body[data-phase="result"] #toast{display:none}
#startChoice{position:fixed;inset:0;z-index:60;background:rgba(6,12,22,.82);display:none;align-items:center;justify-content:center;padding:16px;touch-action:none}
#startChoice.open{display:flex}
#startChoice .box{width:min(340px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
#startChoice h2{margin:0;font-size:20px}
#startChoice button{min-height:72px;border-radius:16px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;padding:8px}
#startChoice button#chManual{background:var(--accent);border-color:#fff}
#startChoice small{font-size:12px;font-weight:600;opacity:.9}
#panel .depthrow{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0}
#panel .depthrow button{width:56px;height:48px;border-radius:12px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);font-size:24px;font-weight:800}
#panel .depthrow b{font-size:22px;min-width:84px;text-align:center}
#panel .seg.col{flex-direction:column;align-items:stretch}
#panel .seg.col button{text-align:left;line-height:1.35}
#panel .seg button[disabled]{opacity:.4}
#panel .seg small{display:block;font-weight:600;opacity:.85;font-size:12px}
#panel table{width:100%;border-collapse:collapse;font-size:13px}
#panel td,#panel th{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
#panel .dim{opacity:.55}
/* パネル */
#panel{position:fixed;inset:0;z-index:40;background:rgba(6,12,22,.92);display:none;touch-action:pan-y;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sa-t) + 12px) calc(var(--sa-r) + 16px) calc(var(--sa-b) + 16px) calc(var(--sa-l) + 16px)}
#panel.open{display:block}
#panel h2{margin:4px 0 10px;font-size:20px;padding-right:96px}
#panel .close{position:fixed;top:calc(var(--sa-t) + 8px);right:calc(var(--sa-r) + 16px);min-width:84px;height:44px;border-radius:12px;background:var(--accent);font-weight:800;font-size:15px;padding:0 14px;z-index:41}
#panel .sec{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.55}
#panel .lbl{margin:8px 0 4px;font-size:13px;font-weight:700}
#panel .sec h3{margin:0 0 6px;font-size:14px;color:#ffd37a}
#panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
#panel .seg button{min-height:44px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);font-weight:700;font-size:14px}
#panel .seg button.on{background:var(--accent);border-color:#fff}
#panel input[type=range]{width:100%;min-height:36px}
#panel .tag{display:inline-block;padding:1px 8px;border-radius:8px;background:#6b7280;font-size:11px;margin-left:6px;vertical-align:middle}
#panel .act{min-height:44px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);font-weight:700;font-size:14px}
#panel .act.danger{background:rgba(229,72,77,.5)}
#panel canvas{width:100%;max-width:520px;display:block;margin:0 auto;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:#0e4f72;touch-action:none}
#panel ul{margin:4px 0 0 18px;padding:0}
/* ローディング */
#loading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(#173a63,#5b93b8 55%,#e8c9a0);padding:calc(var(--sa-t) + 16px) calc(var(--sa-r) + 20px) calc(var(--sa-b) + 16px) calc(var(--sa-l) + 20px);touch-action:none}
#loading h1{margin:0;font-size:clamp(24px,7vw,40px);letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.45)}
#loading .sub{margin:6px 0 18px;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#bar{width:min(300px,70vw);height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ffcf6e;transition:width .2s}
#loadMsg{margin:10px 0 16px;font-size:13px;min-height:1.4em;text-shadow:0 1px 3px #000}
#play{min-width:220px;height:60px;border-radius:30px;background:var(--accent);border:2px solid #fff;font-weight:800;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#play[disabled]{background:#6b7280;opacity:.8}
#loading .how{margin-top:18px;font-size:12px;line-height:1.7;max-width:420px;text-shadow:0 1px 3px #000;opacity:.95}
#loading .ver{position:absolute;bottom:calc(var(--sa-b) + 8px);font-size:11px;opacity:.7}
/* エラー */
#err{position:fixed;inset:0;z-index:100;background:rgba(40,0,0,.94);display:none;padding:calc(var(--sa-t) + 14px) calc(var(--sa-r) + 14px) calc(var(--sa-b) + 14px) calc(var(--sa-l) + 14px);overflow:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#err.open{display:block}
#err h2{margin:0 0 8px;font-size:18px}
#err pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:rgba(0,0,0,.45);padding:10px;border-radius:8px;max-height:55vh;overflow:auto}
#err button{min-height:44px;padding:0 18px;border-radius:10px;font-weight:700;font-size:15px;margin:8px 8px 0 0;background:#fff;color:#400}
</style>
</head>
<body data-mode="move">

<div id="touch"></div>

  <div id="joyRing" class="mv"><div id="joyKnob"></div></div>
  <button id="btnMenu" class="btn tb mv" data-ui><span class="ic">☰</span><span class="lb">メニュー</span></button>
  <div id="chip" class="chip mv" data-ui data-info><div id="chipTop">波戸浦港</div><small id="chipSub">水辺に近づくと釣れるよ</small></div>

  <button id="btnCam" class="btn tb mv" data-ui><span class="ic">📷</span><span class="lb">視点</span></button>
  <button id="btnRun" class="btn mv" data-ui><span class="ic">🏃</span><span class="lb">走る</span></button>
  <button id="btnBag" class="btn mv" data-ui><span class="ic">📖</span><span class="lb">図鑑</span></button>
  <button id="btnFish" class="btn main mv off" data-ui><span class="ic">🎣</span><span class="lb">釣り開始</span></button>

  <div id="chipF" class="chip fs" data-ui data-info><div id="chipFTop">ウキ釣り（準備中）</div><small id="chipFSub">波戸浦港</small></div>
  <button id="btnGear" class="btn tb fs" data-ui><span class="ic">⚙</span><span class="lb">仕掛け</span></button>

<div id="loading">
  <h1>REAL FISHING WORLD</h1>
  <div class="sub">波戸浦港 — ウキ釣り</div>
  <div id="bar"><i></i></div>
  <div id="loadMsg">起動中…</div>
  <button id="play" disabled>読み込み中…</button>
  <div class="how">左半分をドラッグ＝移動 ／ 右半分をスワイプ＝視点<br>水辺で「釣り開始」→ キャスト → 沈んだら「合わせ」→ 巻いて寄せる。<br>回収ボタンで投げ直し・おまかせ釣りもあります。<br>PC: WASD移動・ドラッグで視点・Fで釣り開始</div>

</div>
<div id="err"><h2>⚠ エラーが発生しました</h2><div id="errMsg"></div><pre id="errStack"></pre>
  <button onclick="location.reload()">再読み込み</button><button onclick="document.getElementById('err').classList.remove('open')">閉じる</button></div>
<noscript><div style="position:fixed;inset:0;background:#000;color:#fff;padding:20px;z-index:200">JavaScript を有効にしてください。</div></noscript>
<script>
/* グローバルエラーオーバーレイ（白画面にしない） */
(function(){
  var shown=0;
  window.__rfwErrors=[];
  function show(title,detail){
    try{
      window.__rfwErrors.push(String(title));
      if(shown>2) return; shown++;
      var e=document.getElementById('err'); if(!e) return;
      document.getElementById('errMsg').textContent=String(title);
      document.getElementById('errStack').textContent=String(detail||'');
      e.classList.add('open');
      var l=document.getElementById('loadMsg'); if(l && !window.__rfwBooted) l.textContent='起動に失敗しました（エラー表示を確認してください）';
    }catch(_){}
  }
  window.__rfwShowError=show;
  window.addEventListener('error',function(ev){ var t=ev.message||'Error'; if(ev.target&&ev.target!==window&&ev.target.src) t='読み込み失敗: '+ev.target.src; show(t,(ev.error&&ev.error.stack)||(ev.filename+':'+ev.lineno+':'+ev.colno)); },true);
  // 未処理のPromise拒否：起動前は致命的として表示。起動後（音声・SW等）は致命的ではないので、ログ＋小さなトーストのみ。
  window.__rfwWarnings=[];
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason, msg=String((r&&r.message)||r);
    if(!window.__rfwBooted){ show('Promise error: '+msg,(r&&r.stack)||''); return; }
    ev.preventDefault();
    window.__rfwWarnings.push(msg);
    try{ console.warn('[non-fatal rejection]',msg); }catch(_){}
    try{ var t=document.getElementById('toast'); if(t && !t.classList.contains('show')){ t.textContent='⚠ 一部の機能で問題が起きました（ゲームは続行できます）'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2600); } }catch(_){}
  });
  setTimeout(function(){ if(!window.__rfwBooted){ var l=document.getElementById('loadMsg'); if(l) l.textContent='起動に時間がかかっています…（通信が遅い可能性があります）'; } },9000);
})();
</script>
<script type="module" src="/src/main.ts" onerror="window.__rfwShowError('main.ts の読み込みに失敗しました','ネットワークまたはビルド設定を確認してください')"></script>
