(function(){
  var shown=0;
  window.__rfwErrors=[];
  function show(title,detail){
    try{
      window.__rfwErrors.push(String(title));
      if(shown>2) return; shown++;
      var e=document.getElementById('err'); if(!e) return;
      document.getElementById('errMsg').textContent=String(title);
      document.getElementById('errStack').textContent=String(detail||'');
      e.classList.add('open');
      var l=document.getElementById('loadMsg'); if(l && !window.__rfwBooted) l.textContent='起動に失敗しました（エラー表示を確認してください）';
    }catch(_){}
  }
  window.__rfwShowError=show;
  window.addEventListener('error',function(ev){ var t=ev.message||'Error'; if(ev.target&&ev.target!==window&&ev.target.src) t='読み込み失敗: '+ev.target.src; show(t,(ev.error&&ev.error.stack)||(ev.filename+':'+ev.lineno+':'+ev.colno)); },true);
  window.addEventListener('unhandledrejection',function(ev){ var r=ev.reason; show('Promise error: '+(r&&r.message||r),(r&&r.stack)||''); });

})();
